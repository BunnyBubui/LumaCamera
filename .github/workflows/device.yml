name: Camera device test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - uses: ./.github/actions/detail-model
      - name: Prepare app and test APKs
        run: bash gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Free space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture a zoomed photo and open its AI copy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            mkdir -p app/build/reports
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.lumora android.permission.CAMERA
            adb shell am start -W -n com.lumora/th.ogay.luma.CameraActivity
            sleep 3
            adb shell screencap -p /sdcard/Download/camera-screen.png
            adb pull /sdcard/Download/camera-screen.png app/build/reports/camera-screen.png
            adb shell am force-stop com.lumora
            bash gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:connectedDebugAndroidTest || (echo "=== crash buffer ==="; adb logcat -d -b crash | tail -150; echo "=== app and memory ==="; adb logcat -d | grep -E "th.ogay|lowmemory|lmkd|Killing|am_kill|DEBUG|libc|Fatal|OutOfMemory" | tail -200; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Camera-device-test-report
          path: |
            app/build/reports/androidTests/
            app/build/reports/camera-screen.png
            app/build/outputs/androidTest-results/

