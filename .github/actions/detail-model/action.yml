name: Prepare Detail SR model
description: Build and validate a bundled offline model from official upstream weights
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/cache@v4
      id: model-cache
      with:
        path: |
          app/src/main/assets/luma-detail-sr2.tflite
          app/src/main/assets/luma-detail-sr2.json
          build/detail-source/
          build/detail-comparison/
        key: detail-sr2-${{ runner.os }}-${{ hashFiles('model/build_detail.py', 'model/compare_detail.py', 'model/detail-source-lock.json') }}
    - name: Install conversion dependencies
      if: steps.model-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check 'tensorflow-cpu==2.19.0' 'numpy==2.1.3' 'Pillow==11.3.0'
        python -m pip install --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
    - name: Convert and check pixel-shuffle and numeric parity
      if: steps.model-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python model/build_detail.py --verify
    - name: Verify tile context and export real comparison crops
      if: steps.model-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python model/compare_detail.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Detail-SR-model-${{ github.job }}
        path: |
          app/src/main/assets/luma-detail-sr2.tflite
          app/src/main/assets/luma-detail-sr2.json
          build/detail-source/observed-source-lock.json
          build/detail-comparison/
        if-no-files-found: error
