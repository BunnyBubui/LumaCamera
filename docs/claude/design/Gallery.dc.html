const ALBUM_NAME = { all: 'ล่าสุดในเครื่อง', camera: 'กล้อง', luma: 'Luma', shot: 'ภาพหน้าจอ', down: 'ดาวน์โหลด', chat: 'แชต' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'luma', cat: 'all', album: 'all', partial: true, open: null, ai: true, toast: '', toastOn: false, gen: 0, searching: false, query: '', sdKey: '', sdX: 0, pulse: false, peek: null, peekStage: 'idle', peekIdx: 0, peekDx: 0, peekSwitch: false };
  }
  componentWillUnmount() { [this.tt, this.lpT, this.pkT, this.pkT2, this.sT].forEach(clearTimeout); }
  rectOf(el) { const root = el.closest('[data-root]'); const r = el.getBoundingClientRect(), rr = root.getBoundingClientRect(); const k = rr.width / 390; return { x: (r.left - rr.left) / k, y: (r.top - rr.top) / k, w: r.width / k, h: r.height / k, k }; }
  openPeek(i, el) {
    const rect = this.rectOf(el);
    clearTimeout(this.pkT2); this.setState({ peek: rect, peekIdx: i, peekStage: 'pre', peekDx: 0 });
    this.pkT = setTimeout(() => this.setState({ peekStage: 'open' }), 30);
  }
  closePeek() {
    if (this.state.peekStage === 'idle') return;
    this.setState({ peekStage: 'close', peekDx: 0 });
    this.pkT2 = setTimeout(() => this.setState({ peekStage: 'idle', peek: null }), 520);
  }
  lgPos(e) {
    const el = this.lgEl; if (!el) return; const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.setProperty('--lx', (x * 100).toFixed(1) + '%'); el.style.setProperty('--ly', (y * 100).toFixed(1) + '%');
    el.style.setProperty('--tx', ((x - 0.5) * Math.min(12, el.offsetWidth * 0.1)).toFixed(1) + 'px');
    el.style.setProperty('--ty', ((y - 0.5) * Math.min(9, el.offsetHeight * 0.1)).toFixed(1) + 'px');
  }
  textOf(it) { const b = BADGE[it.tag]; return [b ? b[0] : '', it.tag, ALBUM_NAME[it.album] || '', it.tag === 'doc' || it.id === 'L1' ? 'ร้านกาแฟ ลูมา ป้าย' : '', it.src === 'luma' ? 'Luma' : 'เครื่อง'].join(' '); }
  say(msg) { clearTimeout(this.tt); this.setState({ toast: msg, toastOn: true }); this.tt = setTimeout(() => this.setState({ toastOn: false }), 1600); }
  blurPulse() { clearTimeout(this.bpT); this.setState({ pulse: true }); this.bpT = setTimeout(() => this.setState({ pulse: false }), 220); }
  liquid(key, val, kind) {
    this.lq = this.lq || {}; const st = this.lq[key] || (this.lq[key] = { prev: null, n: 0, ever: false });
    if (val && val !== st.prev) st.n++;
    if (val) st.ever = true; st.prev = val || null;
    const P = st.n % 2 ? 'A' : 'B'; const view = kind === 'view';
    if (val) return { anim: (view ? 'viewIn' + P + ' 600ms' : 'popIn' + P + ' 520ms') + ' linear both', cls: 'liquid-in', opacity: 1 };

  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#FFD447';
    const device = s.tab === 'device';
    let items;
    if (device) {
      items = DATA.dev.filter((it) => s.album === 'all' || it.album === s.album);
      if (s.partial) items = items.slice(0, 6);
      if (s.cat !== 'all') items = items.filter((it) => it.tag === s.cat);
    } else {
      items = DATA.luma.filter((it) => s.cat === 'all' || it.tag === s.cat);
    }
    const q = s.query.trim().toLowerCase();
    if (q) items = items.filter((it) => this.textOf(it).toLowerCase().includes(q));
    this.items = items;
    const anim = 'rise 360ms cubic-bezier(0.32, 0.72, 0, 1) both';
    const catPos = []; CATS.reduce((x, c) => { catPos.push(x); return x + CAT_W[c.k] + 6; }, 0);
    const catCenter = (i) => catPos[i] + CAT_W[CATS[i].k] / 2;
    const nearestCat = (pos) => CATS.reduce((b, c, i) => (Math.abs(catCenter(i) - pos) < Math.abs(catCenter(b) - pos) ? i : b), 0);
    const catIdx = Math.max(0, CATS.findIndex((c) => c.k === s.cat));
    const catDx = s.sdKey === 'cat' ? s.sdX : 0;
    const catLive = s.sdKey === 'cat' ? nearestCat(catCenter(catIdx) - catDx) : catIdx;
    const tiles = items.map((it, i) => {
      const b = BADGE[it.tag];
      return {
        bg: it.p[0], ground: it.p[1], sun: it.p[2], sunX: it.sunX, horizon: it.horizon,
        hasBadge: !!b, badge: b ? b[0] : '', badgeIcon: b ? b[1] : '',
        label: 'รูปที่ ' + (i + 1) + (b ? ' ' + b[0] : ''),
        anim,
        open: (e) => { if (this.suppress) { this.suppress = false; return; } if (e && e.currentTarget) this.vRect = this.rectOf(e.currentTarget); this.setState({ open: it, ai: it.tag === 'ai' }); },
        down: (e) => {
          this.suppress = false; const el = e.currentTarget; this.lp = { x: e.clientX, y: e.clientY, i, el, id: e.pointerId, open: false };
          clearTimeout(this.lpT); this.lpT = setTimeout(() => { const l = this.lp; if (!l) return; l.open = true; l.x = l.lastX ?? l.x; try { l.el.setPointerCapture(l.id); } catch (_) {} this.openPeek(i, l.el); }, 420);
        },
        move: (e) => {
          const l = this.lp; if (!l) return; l.lastX = e.clientX;
          if (!l.open) { if (Math.hypot(e.clientX - l.x, e.clientY - l.y) > 8) { clearTimeout(this.lpT); this.lp = null; } return; }
          const k = (this.state.peek && this.state.peek.k) || 1; const dx = (e.clientX - l.x) / k; const n = this.items.length;
          if (Math.abs(dx) > 70) {
            const ni = this.state.peekIdx + (dx < 0 ? 1 : -1);
            if (ni >= 0 && ni < n) { l.x = e.clientX; this.setState({ peekIdx: ni, peekDx: dx < 0 ? 60 : -60, peekSwitch: true }); clearTimeout(this.sT); this.sT = setTimeout(() => this.setState({ peekDx: 0, peekSwitch: false }), 20); return; }
          }
          const edge = (this.state.peekIdx === 0 && dx > 0) || (this.state.peekIdx === n - 1 && dx < 0);
          this.setState({ peekDx: edge ? dx * 0.3 : dx * 0.6 });
        },
        up: () => { clearTimeout(this.lpT); const l = this.lp; this.lp = null; if (l && l.open) { this.suppress = true; this.closePeek(); } }
      };
    });
    const v = s.open || DATA.luma[0];
    const showAiCopy = s.open && s.open.tag === 'ai' && s.ai;
    return {
      accent, device, partial: s.partial,
      lgDown: (e) => { const el = e.target.closest && e.target.closest('.lg'); if (!el) return; this.lgEl = el; this.lgStart = { x: e.clientX, y: e.clientY }; el.classList.add('lg-on'); this.lgPos(e); },
      lgMove: (e) => { const st = this.lgStart; if (this.lgEl && st && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) { const el = this.lgEl; el.classList.remove('lg-on'); el.style.setProperty('--tx', '0px'); el.style.setProperty('--ty', '0px'); this.lgEl = null; return; } this.lgPos(e); },
      lgUp: () => { const el = this.lgEl; if (!el) return; el.classList.remove('lg-on'); el.style.setProperty('--tx', '0px'); el.style.setProperty('--ty', '0px'); this.lgEl = null; },
      segX: device ? '100%' : '0%', tabLuma: device ? 'false' : 'true', tabDevice: device ? 'true' : 'false',
      showLuma: () => { if (device) { this.setState({ tab: 'luma', cat: 'all', gen: s.gen + 1 }); this.blurPulse(); } },
      showDevice: () => { if (!device) { this.setState({ tab: 'device', cat: 'all', gen: s.gen + 1 }); this.blurPulse(); } },
      chips: CATS.map((c, i) => ({
        label: c.label, d: IC[c.k], on: s.cat === c.k ? 'true' : 'false', x: catPos[i], w: CAT_W[c.k],
        bg: i === catLive ? accent : 'rgba(255,255,255,0.08)', color: i === catLive ? '#1a1400' : '#fff',
        pick: () => { if (this.sdSwallow) { this.sdSwallow = false; return; } this.setState({ cat: c.k, gen: s.gen + 1 }); this.blurPulse(); }
      })),
      catX: (195 - catPos[catIdx] - CAT_W[CATS[catIdx].k] / 2 + catDx).toFixed(1), catMotion: s.sdKey === 'cat' ? 'none' : 'transform 440ms cubic-bezier(0.2, 0.9, 0.25, 1.15)',
      catDown: (e) => { this.sdSwallow = false; const k = e.currentTarget.getBoundingClientRect().width / e.currentTarget.offsetWidth || 1; this.sd = { x: e.clientX, k, moved: false, lx: e.clientX, lt: Date.now(), vx: 0 }; },
      catMove: (e) => {
        const d = this.sd; if (!d) return; const mx = (e.clientX - d.x) / d.k; if (!d.moved && Math.abs(mx) < 6) return; d.moved = true;
        const now = Date.now(); d.vx = d.vx * 0.6 + ((e.clientX - d.lx) / d.k / Math.max(1, now - d.lt)) * 0.4; d.lx = e.clientX; d.lt = now;
        const lo = catCenter(catIdx) - catCenter(CATS.length - 1), hi = catCenter(catIdx) - catCenter(0);
        this.setState({ sdKey: 'cat', sdX: mx > hi ? hi + (mx - hi) * 0.35 : mx < lo ? lo + (mx - lo) * 0.35 : mx });
      },
      catUp: () => {
        const d = this.sd; this.sd = null; if (!d || !d.moved) return; this.sdSwallow = true; setTimeout(() => { this.sdSwallow = false; }, 60);
        const target = nearestCat(catCenter(catIdx) - this.state.sdX - d.vx * 160);
        this.setState({ sdKey: '', sdX: 0 }); if (target !== catIdx) { this.setState({ cat: CATS[target].k, gen: this.state.gen + 1 }); this.blurPulse(); }
      },
      gridBlur: s.pulse ? 'blur(6px)' : s.searching && !s.query ? 'blur(5px) brightness(0.7)' : 'none',
      albums: ALBUMS.map((a) => ({
        name: a.name, d: a.d, count: s.partial ? 'บางรูป' : a.count, bg: a.bg, ground: a.ground,
        on: s.album === a.k ? 'true' : 'false', outline: s.album === a.k ? accent : 'transparent',
        color: s.album === a.k ? accent : '#fff',
        pick: () => this.setState({ album: a.k, gen: s.gen + 1 })
      })),
      pickMore: () => this.say('เปิดหน้าต่างเลือกรูปของระบบ'),
      allowAll: () => { this.setState({ partial: false }); this.say('เข้าถึงรูปทั้งหมดในเครื่องแล้ว'); },
      gridTitle: q ? 'ผลการค้นหา' : device ? ALBUM_NAME[s.album] : 'ถ่ายด้วย Luma',
      gridCount: items.length + ' รายการ',
      tiles, noTiles: tiles.length === 0,
      openSearch: () => { if (s.searching) { if (this.inputEl) this.inputEl.focus(); return; } this.setState({ searching: true }); clearTimeout(this.sT); this.sT = setTimeout(() => { if (this.inputEl) try { this.inputEl.focus({ preventScroll: true }); } catch (_) {} }, 420); },
      closeSearch: () => { this.setState({ searching: false, query: '' }); if (this.inputEl) this.inputEl.blur(); },
      onQuery: (e) => this.setState({ query: e.target.value }),
      inputRef: (el) => { this.inputEl = el; }, query: s.query, inputTab: s.searching ? '0' : '-1',
      searchW: s.searching ? 358 : 44, searchBg: s.searching ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.08)',
      searchShadow: s.searching ? 'inset 0 1px 0 rgba(255,255,255,0.16), 0 8px 24px rgba(0,0,0,0.3)' : 'none',
      inputOpacity: s.searching ? 1 : 0, inputShift: s.searching ? 0 : 24, inputDelay: s.searching ? 260 : 0,
      headOpacity: s.searching ? 0 : 1, headShift: s.searching ? -24 : 0, titleShift: s.searching ? -40 : 0, headEvents: s.searching ? 'none' : 'auto',
      noMenu: (e) => e.preventDefault(),
      peekDim: s.peekStage === 'open' || s.peekStage === 'pre' ? 1 : 0, peekHidden: s.peekStage === 'idle' ? 'true' : 'false',
      peekTransform: s.peek && s.peekStage !== 'open' ? 'translate(' + (s.peek.x - 20).toFixed(1) + 'px, ' + (s.peek.y - 150).toFixed(1) + 'px) scale(' + (s.peek.w / 350).toFixed(3) + ', ' + (s.peek.h / 512).toFixed(3) + ')' : 'translate(0px, 0px) scale(1)',
      peekOpacity: s.peekStage === 'idle' ? 0 : s.peekStage === 'close' ? 0 : 1,
      peekMotion: s.peekStage === 'open' ? 'transform 480ms cubic-bezier(0.2, 0.9, 0.25, 1.12), opacity 160ms ease' : s.peekStage === 'close' ? 'transform 420ms cubic-bezier(0.32, 0.72, 0, 1), opacity 180ms ease 260ms' : 'none',
      peekDx: s.peekDx.toFixed(1), peekInner: s.peekStage === 'open' ? 1 : 1.04,
      peekSlide: s.peekSwitch ? 'none' : (this.lp && this.lp.open ? 'transform 90ms linear' : 'transform 360ms cubic-bezier(0.34, 1.56, 0.64, 1)'),
      peekPos: (s.peekIdx + 1) + ' / ' + (this.items ? this.items.length : 0),
      pk: (() => { const it = (this.items || [])[s.peekIdx] || DATA.luma[0]; const b = BADGE[it.tag]; return { bg: it.p[0], ground: it.p[1], sun: it.p[2], sunX: it.sunX, horizon: it.horizon, hasBadge: !!b, badge: b ? b[0] : '', badgeIcon: b ? b[1] : '', title: it.src === 'luma' ? 'ถ่ายด้วย Luma' : ALBUM_NAME[it.album] }; })(),
      viewerL: this.liquid('viewer', s.open ? s.open.id : '', 'view'), viewerEvents: s.open ? 'auto' : 'none', viewerHidden: s.open ? 'false' : 'true',
      viewerOrigin: this.vRect ? ((this.vRect.x + this.vRect.w / 2) / 3.9).toFixed(1) + '% ' + ((this.vRect.y + this.vRect.h / 2) / 8.44).toFixed(1) + '%' : '50% 50%',
      viewerTitle: s.open ? (s.open.src === 'luma' ? 'ถ่ายด้วย Luma' : ALBUM_NAME[s.open.album]) : '',
      v: { bg: v.p[0], ground: v.p[1], sun: v.p[2], sunX: v.sunX, horizon: v.horizon, hasAi: !!(s.open && s.open.tag === 'ai') },
      viewerFilter: showAiCopy ? 'contrast(1.08) saturate(1.08)' : s.open && s.open.tag === 'ai' ? 'blur(1.2px)' : 'none',

      showOrig: () => this.setState({ ai: false }), showAi: () => this.setState({ ai: true }),
      closeViewer: () => this.setState({ open: null }),

      info: () => this.say(s.open && s.open.src === 'luma' ? 'ข้อมูลภาพ: ขนาด เวลา และเหตุผลที่ใช้ AI' : 'ข้อมูลภาพจาก MediaStore'),
      toast: s.toast, toastL: this.liquid('toast', s.toastOn ? s.toast : '', 'pop')

  }
}
