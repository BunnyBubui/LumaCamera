      lgMove: (e) => { const st = this.lgStart; if (this.lgEl && st && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) { const el = this.lgEl; el.classList.remove('lg-on'); el.style.setProperty('--tx', '0px'); el.style.setProperty('--ty', '0px'); this.lgEl = null; return; } this.lgPos(e); },
      lgUp: () => { const el = this.lgEl; if (!el) return; el.classList.remove('lg-on'); el.style.setProperty('--tx', '0px'); el.style.setProperty('--ty', '0px'); this.lgEl = null; },
      closeMenu: () => { if (this.state.menuOpen) this.setState({ menuOpen: false, menuPress: false }); }, menuDim: s.menuOpen ? 1 : 0,
      hiTop: 36 + s.hi * 54, hiScale: s.menuPress ? 1.03 : 1,
      menuDown: (e) => { this.mp = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} this.setState({ menuPress: true, hi: this.indexAt(e, e.currentTarget) }); },
      menuMove: (e) => { const i = this.indexAt(e, e.currentTarget); if (i !== this.state.hi && (this.mp || e.pointerType === 'mouse')) this.setState({ hi: i }); },
      menuUp: (e) => { if (!this.mp) return; this.mp = false; this.pickAt(this.indexAt(e, e.currentTarget)); },
      menuCancel: () => { this.mp = false; this.setState({ menuPress: false }); },
      menuTitle: (GROUPS.flatMap((g) => g.rows).find((r) => r.k === ml.key) || {}).label || '',
      menuX: ml.x, menuY: ml.y, menuW: ml.w, menuOrigin: ml.ox + '% ' + (ml.up ? '100%' : '0%'),
      menuL: this.liquid('menu', s.menuOpen ? ml.key : '', 'pop'),
      menuEvents: s.menuOpen ? 'auto' : 'none', menuHidden: s.menuOpen ? 'false' : 'true',
      menuItems: this.opts(ml.key).map((o, i) => ({
        label: o.label, note: o.note || '', hasNote: !!o.note, on: i === mv ? 'true' : 'false', check: i === mv,
        weight: i === s.hi ? 600 : 400, scale: s.menuPress && i === s.hi ? 1.02 : 1,
        pick: () => this.pickAt(i)
      }))
    };
  }
}
</script>
